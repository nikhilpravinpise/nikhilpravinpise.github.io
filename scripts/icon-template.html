<!doctype html>
<!-- Source artwork for assets/icon-*.png. Rendered square at 180/192/512
     by scripts/generate-og-image.js; everything scales via vmin. -->
<html>
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100vmin;height:100vmin;overflow:hidden;background:transparent;}
  body{display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;}
  .tile{width:100vmin;height:100vmin;background:#0d1117;border-radius:20vmin;
    display:flex;align-items:center;justify-content:center;
    border:1.5vmin solid #30363d;}
  .glyph{color:#39d353;font-size:52vmin;font-weight:700;line-height:1;
    transform:translateY(-2vmin);}
</style>
</head>
<body>
<div class="tile"><span class="glyph">&gt;_</span></div>
</body>
</html>
