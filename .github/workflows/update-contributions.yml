name: Update contribution data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate data + fallback snapshot
        env:
          # PAT only needed to count private contributions; the workflow token
          # is enough for the public contribution calendar + public repos.
          CONTRIB_PAT: ${{ secrets.CONTRIB_PAT || github.token }}
        run: node scripts/sync-github-data.js

      - name: Validate generated data
        run: node scripts/validate-data.js

      - name: Regenerate social preview image
        # keeps the OG card's stats honest; ubuntu runners ship Chrome
        continue-on-error: true
        env:
          OG_BROWSER: /usr/bin/google-chrome
        run: node scripts/generate-og-image.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ assets/fallback.js assets/og-image.png
          if git diff --staged --quiet; then
            echo "no changes - nothing to commit"
            exit 0
          fi
          git commit -m "chore: refresh contribution data"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed - retrying"
            sleep 5
          done
          exit 1
